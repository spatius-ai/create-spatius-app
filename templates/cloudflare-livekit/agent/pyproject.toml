[project]
name = "spatius-livekit-agent"
version = "0.1.0"
description = "A LiveKit voice agent with a Spatius avatar"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
  "livekit-agents[spatius]~=1.8.1",
  "livekit-plugins-noise-cancellation~=0.3.0",
  "python-dotenv>=1.2.1,<2",
]

[project.optional-dependencies]
dev = ["ruff>=0.15,<1"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
