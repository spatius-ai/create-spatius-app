name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: ${{ matrix.os }} / Node.js ${{ matrix.node-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node-version: 22
          - os: ubuntu-latest
            node-version: 24
          - os: macos-latest
            node-version: 24
          - os: windows-latest
            node-version: 24

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify project
        run: pnpm check

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Review dependency changes
        uses: actions/dependency-review-action@v5.0.0
        with:
          fail-on-severity: high

  template:
    name: Template / ${{ matrix.stack }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        stack:
          - cloudflare-livekit
          - cloudflare-agora

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Set up uv
        if: matrix.stack == 'cloudflare-livekit'
        uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: '3.13'

      - name: Install generator dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate and verify application and browser interactions
        run: pnpm build && node scripts/check-template.mjs --browser --stack "${{ matrix.stack }}"

      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: template-browser-results-${{ strategy.job-index }}
          path: test-results/
          if-no-files-found: ignore

  template-result:
    name: Generated application template
    needs: template
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require every template variant to pass
        env:
          TEMPLATE_RESULT: ${{ needs.template.result }}
        run: |
          if [ "$TEMPLATE_RESULT" != "success" ]; then
            echo "Template matrix did not succeed: $TEMPLATE_RESULT"
            exit 1
          fi
