name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: ${{ matrix.os }} / Node.js ${{ matrix.node-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node-version: 22
          - os: ubuntu-latest
            node-version: 24
          - os: macos-latest
            node-version: 24
          - os: windows-latest
            node-version: 24

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify project
        run: pnpm check

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Review dependency changes
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  template:
    name: Template / ${{ matrix.template }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        template:
          - zeabur-agora/minimal
          - cloudflare-livekit/minimal
          - cloudflare-livekit/tutoring
          - cloudflare-livekit/live-streaming
          - cloudflare-livekit/customer-service
          - cloudflare-livekit/companion
          - cloudflare-livekit-railway/minimal
          - cloudflare-livekit-railway/tutoring
          - cloudflare-livekit-railway/live-streaming
          - cloudflare-livekit-railway/customer-service
          - cloudflare-livekit-railway/companion
          - railway-livekit-cloud/minimal
          - railway-livekit-cloud/tutoring
          - railway-livekit-cloud/live-streaming
          - railway-livekit-cloud/customer-service
          - railway-livekit-cloud/companion
          - railway-livekit/minimal
          - railway-livekit/tutoring
          - railway-livekit/live-streaming
          - railway-livekit/customer-service
          - railway-livekit/companion

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: '3.13'

      - name: Install generator dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate and verify application and browser interactions
        run: pnpm build && node scripts/check-template.mjs --browser --template "${{ matrix.template }}"

      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: template-browser-results-${{ strategy.job-index }}
          path: test-results/
          if-no-files-found: ignore
