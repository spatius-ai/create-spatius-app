name: Terminal preview

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terminal-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  record:
    name: Onboarding recording
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install recording tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          curl -fsSL https://github.com/asciinema/agg/releases/download/v1.9.0/agg-x86_64-unknown-linux-gnu -o "$RUNNER_TEMP/agg"
          echo "f111e315cd71056b116302342553dd765b7297579ed511f111d0cedb442aeda6  $RUNNER_TEMP/agg" | sha256sum --check
          chmod +x "$RUNNER_TEMP/agg"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - run: pnpm install --frozen-lockfile

      - name: Record onboarding
        run: pnpm terminal:record

      - name: Upload recording
        id: recording
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: terminal-preview-${{ github.event.pull_request.number || github.run_number }}-${{ github.sha }}
          path: test-results/terminal/
          if-no-files-found: warn
          retention-days: 30

      - name: Link recording from job summary
        if: always() && steps.recording.outputs.artifact-url != ''
        env:
          ARTIFACT_URL: ${{ steps.recording.outputs.artifact-url }}
        run: |
          {
            echo '### CLI onboarding preview'
            echo
            echo "[Download GIF, MP4, and asciicast replay]($ARTIFACT_URL)"
            echo
            echo 'Actual CLI in an 80 × 30 terminal. Scripted answers and simulated dependency installation; credential setup is skipped. Failed runs may contain only a partial asciicast.'
          } >> "$GITHUB_STEP_SUMMARY"
